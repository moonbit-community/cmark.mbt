name: bench
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  deployments: write

env:
  MOON_SEPARATE_COMPILATION: "1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Run benchmark
        env:
          MOONC_INTERNAL_PARAMS: "allocator = tlsf-mbt |"
        run: |
          set -euo pipefail
          moon update
          results=()
          for t in js wasm wasm-gc native; do
            output=$(moon run cmarkwrap --target "$t" --release --quiet)
            while IFS= read -r result; do
              results+=("$result")
            done <<< "$output"
          done
          (IFS=,; printf '[%s]\n' "${results[*]}") > bench-output.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmark.js Benchmark
          tool: customBiggerIsBetter
          output-file-path: bench-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          gh-pages-branch: bench-pages
          alert-threshold: "200%"
          comment-on-alert: ${{ github.event_name == 'push' }}
